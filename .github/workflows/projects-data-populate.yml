name: "PR Metrics to Project V2 Sync"

on:
  workflow_dispatch:
  schedule:
    # Runs every night at midnight UTC
    - cron: '0 0 * * *'

jobs:
  sync-pr-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Extract PR Metrics & Update Project V2
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            // =========================================================================
            // CONFIGURATION: Replace these with your exact Project V2 & Field IDs
            // =========================================================================
            const PROJECT_ID = "PVT_kwHOCbDnFc4Be6cg"; 

            const FIELD_IDS = {
              jiraItems:      "PVTF_lAHOCbDnFc4Be6cgzhZRL4U",      // Text
              taskType:       "PVTF_lAHOCbDnFc4Be6cgzhZRMEk",       // Text
              prId:           "PVTF_lAHOCbDnFc4Be6cgzhZRMQM",           // Number
              prTitle:        "PVTF_lAHOCbDnFc4Be6cgzhZRMpc",        // Text
              prDesc:         "PVTF_lAHOCbDnFc4Be6cgzhZRMx4",         // Text
              reviewComments: "PVTF_lAHOCbDnFc4Be6cgzhZRM20", // Number
              botComments:    "PVTF_lAHOCbDnFc4Be6cgzhZRnTo",    // Number
              prDefects:      "PVTF_lAHOCbDnFc4Be6cgzhZRgsw"       // Number
            };
            // =========================================================================

            // GraphQL Query: Fetch PR details across OPEN, MERGED, and CLOSED states
            const query = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  pullRequests(
                    states: [OPEN, MERGED, CLOSED], 
                    first: 50, 
                    orderBy: {field: UPDATED_AT, direction: DESC}
                  ) {
                    nodes {
                      id # GraphQL Node ID needed to link item to Project V2
                      number
                      title
                      body
                      headRefName
                      
                      # (b) PR Labels
                      labels(first: 10) {
                        nodes {
                          name
                        }
                      }

                      # (d) Top-Level Discussion Comments
                      comments(first: 100) {
                        nodes {
                          body
                          author {
                            login
                            __typename
                          }
                        }
                      }

                      # (d) Inline Code Review Comments (Root Threads Only)
                      reviewThreads(first: 100) {
                        nodes {
                          comments(first: 1) {
                            nodes {
                              body
                              author {
                                login
                                __typename
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const variables = { owner: context.repo.owner, repo: context.repo.repo };
            const result = await github.graphql(query, variables);
            const pullRequests = result.repository.pullRequests.nodes;

            const defectRegex = /(?:PR\s*)?Defects?:\s*(\d+)/i;

            const addItemMutation = `
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                  item {
                    id
                  }
                }
              }
            `;

            const updateFieldMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: ProjectV2FieldValue!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId,
                    itemId: $itemId,
                    fieldId: $fieldId,
                    value: $value
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;

            for (const pr of pullRequests) {
              console.log(`Processing PR #${pr.number}: ${pr.title}`);

              // a) JIRA ID Extraction
              const jiraMatch = pr.headRefName.match(/\d+/);
              const jiraId = jiraMatch ? jiraMatch[0] : 'N/A';

              // b) Task Type (Labels)
              const labels = pr.labels.nodes.map(l => l.name);
              const taskType = labels.length > 0 ? labels.join(', ') : 'Unlabeled';

              // c) PR Details
              const prId = pr.number;
              const prTitle = pr.title;
              const prDesc = pr.body || 'No description provided';

              // d) Comment & Bot Counting
              let reviewCommentsCount = 0;
              let botCommentsCount = 0;
              let prDefectsCount = 0;

              const processComment = (body, author) => {
                const isBot = author 
                  ? (author.__typename === 'Bot' || author.login.endsWith('[bot]')) 
                  : false;

                if (isBot) {
                  botCommentsCount++;
                } else {
                  reviewCommentsCount++;
                }

                // e) PR Defects extraction
                const defectMatch = body ? body.match(defectRegex) : null;
                if (defectMatch) {
                  prDefectsCount += parseInt(defectMatch[1], 10);
                }
              };

              // Process top-level and inline root comments
              pr.comments.nodes.forEach(c => processComment(c.body, c.author));
              pr.reviewThreads.nodes.forEach(thread => {
                const rootComment = thread.comments.nodes[0];
                if (rootComment) processComment(rootComment.body, rootComment.author);
              });

              // STEP 1: Add PR to Project V2 (or fetch existing item ID)
              const itemResult = await github.graphql(addItemMutation, {
                projectId: PROJECT_ID,
                contentId: pr.id
              });

              const itemId = itemResult.addProjectV2ItemById.item.id;

              // STEP 2: Update Custom Fields safely
              const updateField = async (fieldId, value) => {
                if (!fieldId) return;
                try {
                  await github.graphql(updateFieldMutation, {
                    projectId: PROJECT_ID,
                    itemId: itemId,
                    fieldId: fieldId,
                    value: value
                  });
                } catch (error) {
                  console.error(`Error updating field ID ${fieldId}:`, error.message);
                }
              };

              // Update Text Fields
              await updateField(FIELD_IDS.jiraItems, { text: String(jiraId || "N/A") });
              await updateField(FIELD_IDS.taskType,  { text: String(taskType || "Unlabeled") });
              await updateField(FIELD_IDS.prTitle,   { text: String(prTitle || "No Title") });
              await updateField(FIELD_IDS.prDesc,    { text: String(prDesc || "No Description") });

              // Update Number Fields
              await updateField(FIELD_IDS.prId,           { number: Number(prId || 0) });
              await updateField(FIELD_IDS.reviewComments, { number: Number(reviewCommentsCount || 0) });
              await updateField(FIELD_IDS.botComments,    { number: Number(botCommentsCount || 0) });
              await updateField(FIELD_IDS.prDefects,      { number: Number(prDefectsCount || 0) });

              console.log(`Successfully synced PR #${pr.number} to Project V2.`);
            }

