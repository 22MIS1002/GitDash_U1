name: "PR Metrics to Project V2 & Pages Sync"

on:
  workflow_dispatch:
    inputs:
      fetch_all_historical:
        description: 'Fetch ALL historical PRs? (Check for first-time setup, leave unchecked for last 24hrs)'
        required: false
        type: boolean
        default: false
  schedule:
    # Runs twice a day at 12:00 AM and 12:00 PM IST (6:30 PM and 6:30 AM UTC)
    - cron: '30 6,18 * * *'

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  sync-pr-metrics:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Restore Cached metrics.json from previous workflow run
      - name: Restore Cached metrics.json
        uses: actions/cache/restore@v4
        with:
          path: ./dashboards/metrics.json
          key: metrics-json-${{ github.run_id }}
          restore-keys: |
            metrics-json-

      # Step 3: Extract PR Data, Update Project V2, and Merge JSON
      - name: Extract PR Metrics & Update Project V2 & JSON
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const fs = require('fs');

            // =========================================================================
            // CONFIGURATION: Replace these with your exact Project V2 & Field IDs
            // =========================================================================
            const PROJECT_ID = "PVT_kwHOCbDnFc4Be6cg"; 

            const FIELD_IDS = {
              jiraItems:            "PVTF_lAHOCbDnFc4Be6cgzhZRL4U",       // Text
              taskType:             "PVTF_lAHOCbDnFc4Be6cgzhZRMEk",       // Text
              prId:                 "PVTF_lAHOCbDnFc4Be6cgzhZRMQM",       // Number
              prTitle:              "PVTF_lAHOCbDnFc4Be6cgzhZRMpc",       // Text
              reviewComments:       "PVTF_lAHOCbDnFc4Be6cgzhZRM20",       // Number
              botComments:          "PVTF_lAHOCbDnFc4Be6cgzhZRnTo",       // Number
              prDefects:            "PVTF_lAHOCbDnFc4Be6cgzhZRgsw",       // Number
              prStatus:             "PVTSSF_lAHOCbDnFc4Be6cgzhZVWwU",       // Single Select
              prCreatedDate:        "PVTF_lAHOCbDnFc4Be6cgzhZjmIo",       // Date
              prAuthor:             "PVTF_lAHOCbDnFc4Be6cgzhZjmMA",       // Text
              tiDefects:            "PVTF_lAHOCbDnFc4Be6cgzhZjmTE",       // Number
              prChecklist:          "PVTSSF_lAHOCbDnFc4Be6cgzhZjmZM",       // Single Select
              copilotComments:      "PVTF_lAHOCbDnFc4Be6cgzhZuiFc",       // Number

              // 13 Sub-Category Number Fields
              questions:            "PVTF_lAHOCbDnFc4Be6cgzhZk_vY",       // Number
              major:                "PVTF_lAHOCbDnFc4Be6cgzhZk_yw",       // Number
              minor:                "PVTF_lAHOCbDnFc4Be6cgzhZk_6M",       // Number
              missing:              "PVTF_lAHOCbDnFc4Be6cgzhZlACg",       // Number
              extraSuperfluous:     "PVTF_lAHOCbDnFc4Be6cgzhZlANU",       // Number
              ambiguous:            "PVTF_lAHOCbDnFc4Be6cgzhZlAVQ",       // Number
              inconsistent:         "PVTF_lAHOCbDnFc4Be6cgzhZlAYc",       // Number
              improvementDesirable: "PVTF_lAHOCbDnFc4Be6cgzhZlAnQ",       // Number
              notConforming:        "PVTF_lAHOCbDnFc4Be6cgzhZlAqE",       // Number
              riskProne:            "PVTF_lAHOCbDnFc4Be6cgzhZlAx8",       // Number
              factuallyIncorrect:   "PVTF_lAHOCbDnFc4Be6cgzhZlA3Y",       // Number
              notImplementable:     "PVTF_lAHOCbDnFc4Be6cgzhZlA9I",       // Number
              editorial:            "PVTF_lAHOCbDnFc4Be6cgzhZlBCI"        // Number
            };

            const STATUS_OPTIONS = {
              OPEN:   "a169abfa", 
              MERGED: "c29cb3fa", 
              CLOSED: "e18667b6"  
            };

            const CHECKLIST_OPTIONS = {
              YES: "4642dbc2", 
              NO:  "f3665cfb"  
            };

            const LABEL_PATTERNS = {
              questions:            /\*\*\[QUESTION\]\*\*/i,
              major:                /\*\*\[MAJOR\]\*\*/i,
              minor:                /\*\*\[MINOR\]\*\*/i,
              missing:              /\*\*\[MISSING\]\*\*/i,
              extraSuperfluous:     /\*\*\[EXTRA\/SUPERFLUOUS\]\*\*/i,
              ambiguous:            /\*\*\[AMBIGUOUS\]\*\*/i,
              inconsistent:         /\*\*\[INCONSISTENT\]\*\*/i,
              improvementDesirable: /\*\*\[IMPROVEMENT DESIRABLE\]\*\*/i,
              notConforming:        /\*\*\[NOT CONFORMING TO STANDARDS\]\*\*/i,
              riskProne:            /\*\*\[RISK-PRONE\]\*\*/i,
              factuallyIncorrect:   /\*\*\[FACTUALLY INCORRECT\]\*\*/i,
              notImplementable:     /\*\*\[NOT IMPLEMENTABLE\]\*\*/i,
              editorial:            /\*\*\[EDITORIAL\]\*\*/i
            };
            // =========================================================================

            const existingPrsMap = new Map();
            const isManualFullSync = context.payload.inputs?.fetch_all_historical === 'true';

            // 1. Load existing metrics from Local Restored Cache OR Live URL
            if (!isManualFullSync) {
              // Priority A: Check if restored from GitHub Actions Cache
              if (fs.existsSync('./dashboards/metrics.json')) {
                try {
                  const localContent = fs.readFileSync('./dashboards/metrics.json', 'utf8');
                  const localData = JSON.parse(localContent);
                  (localData.prs || []).forEach(p => existingPrsMap.set(p.prId, p));
                  console.log(`Loaded ${existingPrsMap.size} existing PRs from restored Actions Cache.`);
                } catch (e) {
                  console.log("Failed to parse local cached metrics.json file.");
                }
              }

              // Priority B: Fallback to live URL if local cache was empty
              if (existingPrsMap.size === 0) {
                try {
                  const owner = context.repo.owner.toLowerCase();
                  const repo = context.repo.repo;
                  const pagesUrl = `https://${owner}.github.io/${repo}/metrics.json`;
                  console.log(`Attempting fallback fetch from live Pages URL: ${pagesUrl}`);
                  const response = await fetch(pagesUrl);
                  if (response.ok) {
                    const liveData = await response.json();
                    (liveData.prs || []).forEach(p => existingPrsMap.set(p.prId, p));
                    console.log(`Loaded ${existingPrsMap.size} existing PRs from live Pages URL.`);
                  }
                } catch (err) {
                  console.log("No live metrics.json found on Pages. Starting fresh.");
                }
              }
            }

            // 2. Determine Search Query
            let searchQuery = `repo:${context.repo.owner}/${context.repo.repo} is:pr`;

            if (isManualFullSync) {
              console.log("Triggered Manual Full Sync: Fetching ALL historical PRs.");
            } else {
              const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
              searchQuery += ` updated:>=${yesterday}`;
              console.log(`Incremental Sync: Fetching PRs updated since ${yesterday}`);
            }

            // 3. GraphQL Query
            const query = `
              query($searchQuery: String!, $cursor: String) {
                search(query: $searchQuery, type: ISSUE, first: 100, after: $cursor) {
                  pageInfo {
                    hasNextPage
                    endCursor
                  }
                  nodes {
                    ... on PullRequest {
                      id
                      number
                      title
                      body
                      state
                      headRefName
                      createdAt
                      author { login }
                      
                      commits(last: 1) {
                        nodes {
                          commit {
                            statusCheckRollup {
                              contexts(first: 50) {
                                nodes {
                                  ... on StatusContext { context state }
                                  ... on CheckRun { name conclusion }
                                }
                              }
                            }
                          }
                        }
                      }
                      
                      labels(first: 10) { nodes { name } }
                      comments(first: 100) {
                        nodes {
                          body
                          author { login __typename }
                        }
                      }
                      reviewThreads(first: 100) {
                        nodes {
                          comments(first: 1) {
                            nodes {
                              body
                              author { login __typename }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            // 4. Fetch Data with Pagination
            let pullRequests = [];
            let hasNextPage = true;
            let cursor = null;

            while (hasNextPage) {
              const variables = { searchQuery, cursor };
              const result = await github.graphql(query, variables);
              pullRequests.push(...result.search.nodes);
              hasNextPage = result.search.pageInfo.hasNextPage;
              cursor = result.search.pageInfo.endCursor;
            }

            console.log(`Found ${pullRequests.length} updated PR(s) to process.`);

            const addItemMutation = `
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                  item { id }
                }
              }
            `;

            const updateFieldMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: ProjectV2FieldValue!) {
                updateProjectV2ItemFieldValue(
                  input: { projectId: $projectId, itemId: $itemId, fieldId: $fieldId, value: $value }
                ) { projectV2Item { id } }
              }
            `;

            // 5. Process PRs and merge into existingPrsMap
            for (const pr of pullRequests) {
              if (!pr.number) continue; 
              
              console.log(`Processing PR #${pr.number}: ${pr.title}`);

              const jiraMatch = pr.headRefName.match(/\d+/);
              const jiraId = jiraMatch ? jiraMatch[0] : 'N/A';
              const labels = pr.labels.nodes.map(l => l.name);
              const taskType = labels.length > 0 ? labels.join(', ') : 'Unlabeled';
              const prState = pr.state; 

              let reviewCommentsCount = 0;
              let botCommentsCount = 0;
              let prDefectsCount = 0;
              let tiDefectsCount = 0;
              let copilotCommentsCount = 0;

              const subCategoryCounts = {
                questions: 0, major: 0, minor: 0, missing: 0,
                extraSuperfluous: 0, ambiguous: 0, inconsistent: 0,
                improvementDesirable: 0, notConforming: 0, riskProne: 0,
                factuallyIncorrect: 0, notImplementable: 0, editorial: 0
              };

              const processComment = (body, author) => {
                const isBot = author ? (author.__typename === 'Bot' || author.login.endsWith('[bot]')) : false;
                if (isBot) botCommentsCount++;
                else reviewCommentsCount++;

                if (body) {
                  const cleanBody = body.replace(/[*_`~|]/g, ' ').replace(/<\/?[^>]+(>|$)/g, ' ');
                  const defectRegex = /(?:PR\s*)?Defects?[\s:\-=]*(\d+)/i;
                  const defectMatch = cleanBody.match(defectRegex);
                  if (defectMatch) {
                    prDefectsCount = parseInt(defectMatch[1], 10);
                  }
                }
              };

              // Process Standard Comments
              pr.comments.nodes.forEach(c => processComment(c.body, c.author));
              
              // Process Inline Review Comments (Bulletproof check)
              pr.reviewThreads.nodes.forEach(thread => {
                const rootComment = thread.comments.nodes[0];
                if (rootComment && rootComment.body && rootComment.author) {
                  processComment(rootComment.body, rootComment.author);
                  
                  const authorLogin = rootComment.author.login ? rootComment.author.login.toLowerCase() : '';
                  if (authorLogin.includes('copilot')) {
                    copilotCommentsCount++;
                  }

                  if (rootComment.body.match(/\*\*\[Defect\]\*\*/i)) {
                    tiDefectsCount++;
                  }

                  for (const [key, pattern] of Object.entries(LABEL_PATTERNS)) {
                    if (rootComment.body.match(pattern)) {
                      subCategoryCounts[key]++;
                    }
                  }
                }
              });

              // Process Checklist Status
              let hasChecklist = false;
              const commits = pr.commits?.nodes?.[0]?.commit;
              const contexts = commits?.statusCheckRollup?.contexts?.nodes || [];
              
              for (const check of contexts) {
                const name = check.context || check.name;
                const state = check.state || check.conclusion;
                if (name === 'prti-check' && state === 'SUCCESS') {
                  hasChecklist = true;
                  break;
                }
              }
              const checklistOptionId = hasChecklist ? CHECKLIST_OPTIONS.YES : CHECKLIST_OPTIONS.NO;

              // TARGET A: Update Projects V2
              try {
                const itemResult = await github.graphql(addItemMutation, {
                  projectId: PROJECT_ID,
                  contentId: pr.id
                });
                const itemId = itemResult.addProjectV2ItemById.item.id;

                const updateField = async (fieldId, value) => {
                  if (!fieldId) return;
                  try {
                    await github.graphql(updateFieldMutation, {
                      projectId: PROJECT_ID, itemId: itemId, fieldId: fieldId, value: value
                    });
                  } catch (e) { console.error(`Error updating field ${fieldId}:`, e.message); }
                };

                await updateField(FIELD_IDS.jiraItems,      { text: String(jiraId || "N/A") });
                await updateField(FIELD_IDS.taskType,       { text: String(taskType || "Unlabeled") });
                await updateField(FIELD_IDS.prTitle,        { text: String(pr.title || "No Title") });
                await updateField(FIELD_IDS.prId,           { number: Number(pr.number || 0) });
                await updateField(FIELD_IDS.reviewComments, { number: Number(reviewCommentsCount || 0) });
                await updateField(FIELD_IDS.botComments,    { number: Number(botCommentsCount || 0) });
                await updateField(FIELD_IDS.prDefects,      { number: Number(prDefectsCount || 0) });
                await updateField(FIELD_IDS.prAuthor,       { text: String(pr.author?.login || "Unknown") });
                await updateField(FIELD_IDS.prCreatedDate,  { date: pr.createdAt.substring(0, 10) });
                await updateField(FIELD_IDS.tiDefects,      { number: Number(tiDefectsCount || 0) });
                await updateField(FIELD_IDS.copilotComments,{ number: Number(copilotCommentsCount || 0) });
                await updateField(FIELD_IDS.prChecklist,    { singleSelectOptionId: checklistOptionId });

                const statusOptionId = STATUS_OPTIONS[prState];
                if (statusOptionId) await updateField(FIELD_IDS.prStatus, { singleSelectOptionId: statusOptionId });

                for (const [key, count] of Object.entries(subCategoryCounts)) {
                  if (FIELD_IDS[key]) await updateField(FIELD_IDS[key], { number: Number(count || 0) });
                }
              } catch (projErr) {
                console.error(`Project V2 update warning for PR #${pr.number}:`, projErr.message);
              }

              // TARGET B: Update or Insert into Map for dashboards/metrics.json
              existingPrsMap.set(pr.number, {
                prId: pr.number,
                jiraItem: jiraId,
                prTitle: pr.title,
                prAuthor: pr.author?.login || 'Unknown',
                prCreatedDate: pr.createdAt.substring(0, 10),
                prStatus: prState,
                prChecklist: hasChecklist ? 'YES' : 'NO',
                reviewComments: reviewCommentsCount,
                botComments: botCommentsCount,
                copilotComments: copilotCommentsCount,
                prDefects: prDefectsCount,
                tiDefects: tiDefectsCount,
                ...subCategoryCounts
              });
            }

            // 6. Write combined metrics.json into ./dashboards directory
            if (!fs.existsSync('./dashboards')) {
              fs.mkdirSync('./dashboards');
            }

            const jsonPayload = {
              lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC',
              prs: Array.from(existingPrsMap.values())
            };

            fs.writeFileSync('./dashboards/metrics.json', JSON.stringify(jsonPayload, null, 2));
            console.log(`Successfully generated ./dashboards/metrics.json with ${jsonPayload.prs.length} total PRs!`);

      # Step 4: Save Updated metrics.json to Actions Cache for future runs
      - name: Save Cached metrics.json
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ./dashboards/metrics.json
          key: metrics-json-${{ github.run_id }}

      # Step 5: Package the dashboards/ directory for GitHub Pages
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dashboards'

      # Step 6: Deploy Artifact to GitHub Pages CDN
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

