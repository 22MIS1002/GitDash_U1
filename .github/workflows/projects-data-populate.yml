name: "PR Metrics to Project V2 Sync"

on:
  workflow_dispatch:
    inputs:
      fetch_all_historical:
        description: 'Fetch ALL historical PRs? (Check for first-time setup, leave unchecked for last 24hrs)'
        required: false
        type: boolean
        default: false
  schedule:
    # Runs twice a day at 12:00 AM and 12:00 PM IST (which is 6:30 PM and 6:30 AM UTC)
    - cron: '30 6,18 * * *'

jobs:
  sync-pr-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Extract PR Metrics & Update Project V2
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            // =========================================================================
            // CONFIGURATION: Replace these with your exact Project V2 & Field IDs
            // =========================================================================
            const PROJECT_ID = "PVT_kwHOCbDnFc4Be6cg"; 

            const FIELD_IDS = {
              jiraItems:      "PVTF_lAHOCbDnFc4Be6cgzhZRL4U",       // Text
              taskType:       "PVTF_lAHOCbDnFc4Be6cgzhZRMEk",       // Text
              prId:           "PVTF_lAHOCbDnFc4Be6cgzhZRMQM",       // Number
              prTitle:        "PVTF_lAHOCbDnFc4Be6cgzhZRMpc",       // Text
              reviewComments: "PVTF_lAHOCbDnFc4Be6cgzhZRM20",       // Number
              botComments:    "PVTF_lAHOCbDnFc4Be6cgzhZRnTo",       // Number
              prDefects:      "PVTF_lAHOCbDnFc4Be6cgzhZRgsw",       // Number
              prStatus:       "PVTSSF_lAHOCbDnFc4Be6cgzhZVWwU",       // Single Select
              
              // NEW FIELDS
              prCreatedDate:  "PVTF_lAHOCbDnFc4Be6cgzhZjmIo",       // Date
              prAuthor:       "PVTF_lAHOCbDnFc4Be6cgzhZjmMA",       // Text
              tiDefects:      "PVTF_lAHOCbDnFc4Be6cgzhZjmTE",       // Number
              prChecklist:    "PVTSSF_lAHOCbDnFc4Be6cgzhZjmZM"        // Single Select
            };

            const STATUS_OPTIONS = {
              OPEN:   "a169abfa", 
              MERGED: "c29cb3fa", 
              CLOSED: "e18667b6"  
            };

            const CHECKLIST_OPTIONS = {
              YES: "4642dbc2", // Option ID for "Yes"
              NO:  "f3665cfb"  // Option ID for "No"
            };
            // =========================================================================

            // 1. Determine Search Query (Incremental vs Full)
            const isManualFullSync = context.payload.inputs?.fetch_all_historical === 'true';
            let searchQuery = `repo:${context.repo.owner}/${context.repo.repo} is:pr`;

            if (isManualFullSync) {
              console.log("Triggered Manual Full Sync: Fetching ALL historical PRs.");
            } else {
              // Calculate 24 hours ago in ISO format
              const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
              searchQuery += ` updated:>=${yesterday}`;
              console.log(`Incremental Sync: Fetching PRs updated since ${yesterday}`);
            }

            // 2. GraphQL Query with Pagination & Status Checks
            const query = `
              query($searchQuery: String!, $cursor: String) {
                search(query: $searchQuery, type: ISSUE, first: 100, after: $cursor) {
                  pageInfo {
                    hasNextPage
                    endCursor
                  }
                  nodes {
                    ... on PullRequest {
                      id
                      number
                      title
                      body
                      state
                      headRefName
                      createdAt
                      author {
                        login
                      }
                      
                      # Check for Markdown/Checklist Status
                      commits(last: 1) {
                        nodes {
                          commit {
                            statusCheckRollup {
                              contexts(first: 50) {
                                nodes {
                                  ... on StatusContext {
                                    context
                                    state
                                  }
                                  ... on CheckRun {
                                    name
                                    conclusion
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                      
                      labels(first: 10) { nodes { name } }
                      comments(first: 100) {
                        nodes {
                          body
                          author { login __typename }
                        }
                      }
                      reviewThreads(first: 100) {
                        nodes {
                          comments(first: 1) {
                            nodes {
                              body
                              author { login __typename }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            // 3. Fetch Data (Handling Pagination for large histories)
            let pullRequests = [];
            let hasNextPage = true;
            let cursor = null;

            while (hasNextPage) {
              const variables = { searchQuery, cursor };
              const result = await github.graphql(query, variables);
              
              const nodes = result.search.nodes;
              pullRequests.push(...nodes);
              
              hasNextPage = result.search.pageInfo.hasNextPage;
              cursor = result.search.pageInfo.endCursor;
            }

            if (pullRequests.length === 0) {
              console.log(`No PRs found matching criteria. Exiting.`);
              return;
            }

            console.log(`Found ${pullRequests.length} PR(s) to sync.`);

            const addItemMutation = `
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                  item { id }
                }
              }
            `;

            const updateFieldMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: ProjectV2FieldValue!) {
                updateProjectV2ItemFieldValue(
                  input: { projectId: $projectId, itemId: $itemId, fieldId: $fieldId, value: $value }
                ) { projectV2Item { id } }
              }
            `;

            // 4. Process the PRs
            for (const pr of pullRequests) {
              if (!pr.number) continue; 
              
              console.log(`Processing PR #${pr.number}: ${pr.title}`);

              const jiraMatch = pr.headRefName.match(/\d+/);
              const jiraId = jiraMatch ? jiraMatch[0] : 'N/A';
              const labels = pr.labels.nodes.map(l => l.name);
              const taskType = labels.length > 0 ? labels.join(', ') : 'Unlabeled';
              const prState = pr.state; 

              // a) Core Metrics processing
              let reviewCommentsCount = 0;
              let botCommentsCount = 0;
              let prDefectsCount = 0;
              let tiDefectsCount = 0; // NEW: TI Defects counter

              const processComment = (body, author) => {
                const isBot = author ? (author.__typename === 'Bot' || author.login.endsWith('[bot]')) : false;
                if (isBot) botCommentsCount++;
                else reviewCommentsCount++;

                if (body) {
                  const cleanBody = body.replace(/[*_`~|]/g, ' ').replace(/<\/?[^>]+(>|$)/g, ' ');
                  const defectRegex = /(?:PR\s*)?Defects?[\s:\-=]*(\d+)/i;
                  const defectMatch = cleanBody.match(defectRegex);
                  if (defectMatch) {
                    prDefectsCount = parseInt(defectMatch[1], 10);
                  }
                }
              };

              // Process Standard Comments
              pr.comments.nodes.forEach(c => processComment(c.body, c.author));
              
              // Process Inline Review Comments & Check for TI Defects
              pr.reviewThreads.nodes.forEach(thread => {
                const rootComment = thread.comments.nodes[0];
                if (rootComment) {
                  processComment(rootComment.body, rootComment.author);
                  
                  // NEW: Check strictly for exactly **[Defect]** (case-insensitive)
                  if (rootComment.body && rootComment.body.match(/\*\*\[Defect\]\*\*/i)) {
                    tiDefectsCount++;
                  }
                }
              });

              // b) Process Checklist Status (Option C Implementation)
              let hasChecklist = false;
              const commits = pr.commits?.nodes?.[0]?.commit;
              const contexts = commits?.statusCheckRollup?.contexts?.nodes || [];
              
              for (const check of contexts) {
                const name = check.context || check.name;
                const state = check.state || check.conclusion;
                
                // If the check is named prti-check and its state is SUCCESS
                if (name === 'prti-check' && (state === 'SUCCESS' || state === 'SUCCESS')) {
                  hasChecklist = true;
                  break;
                }
              }
              const checklistOptionId = hasChecklist ? CHECKLIST_OPTIONS.YES : CHECKLIST_OPTIONS.NO;

              // STEP 1: Add or Get Item on Project Board
              const itemResult = await github.graphql(addItemMutation, {
                projectId: PROJECT_ID,
                contentId: pr.id
              });
              const itemId = itemResult.addProjectV2ItemById.item.id;

              // STEP 2: Update Custom Fields safely
              const updateField = async (fieldId, value) => {
                if (!fieldId) return;
                try {
                  await github.graphql(updateFieldMutation, {
                    projectId: PROJECT_ID, itemId: itemId, fieldId: fieldId, value: value
                  });
                } catch (error) {
                  console.error(`Error updating field ID ${fieldId}:`, error.message);
                }
              };

              // Update Fields
              await updateField(FIELD_IDS.jiraItems, { text: String(jiraId || "N/A") });
              await updateField(FIELD_IDS.taskType,  { text: String(taskType || "Unlabeled") });
              await updateField(FIELD_IDS.prTitle,   { text: String(pr.title || "No Title") });
              await updateField(FIELD_IDS.prId,           { number: Number(pr.number || 0) });
              await updateField(FIELD_IDS.reviewComments, { number: Number(reviewCommentsCount || 0) });
              await updateField(FIELD_IDS.botComments,    { number: Number(botCommentsCount || 0) });
              await updateField(FIELD_IDS.prDefects,      { number: Number(prDefectsCount || 0) });
              
              // Map the GraphQL state (OPEN/MERGED/CLOSED) to your specific Option ID
              const statusOptionId = STATUS_OPTIONS[prState];
              if (statusOptionId) await updateField(FIELD_IDS.prStatus, { singleSelectOptionId: statusOptionId });

              // NEW FIELDS UPDATE
              await updateField(FIELD_IDS.prAuthor, { text: String(pr.author?.login || "Unknown") });
              // Date fields require 'YYYY-MM-DD' format, so we slice the ISO string
              await updateField(FIELD_IDS.prCreatedDate, { date: pr.createdAt.substring(0, 10) });
              await updateField(FIELD_IDS.tiDefects, { number: Number(tiDefectsCount || 0) });
              await updateField(FIELD_IDS.prChecklist, { singleSelectOptionId: checklistOptionId });

              console.log(`Successfully synced PR #${pr.number}`);
            }

