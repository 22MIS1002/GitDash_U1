name: "Phase 1 - Parse Numeric JIRA Ticket from PR Branch"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  extract-jira-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PRs and Extract JIRA IDs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const query = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  pullRequests(states: OPEN, first: 20) {
                    nodes {
                      number
                      title
                      headRefName
                    }
                  }
                }
              }
            `;

            const variables = {
              owner: context.repo.owner,
              repo: context.repo.repo
            };

            const result = await github.graphql(query, variables);
            const pullRequests = result.repository.pullRequests.nodes;

            // Matches standalone numbers (e.g. extracts '1234' from 'feature/1234-login-fix')
            const jiraNumericRegex = /\b\d{3,6}\b/;

            const processedData = pullRequests.map(pr => {
              const match = pr.headRefName.match(jiraNumericRegex);
              const jiraId = match ? match[0] : 'N/A';
              
              return {
                prId: pr.number,
                title: pr.title,
                branch: pr.headRefName,
                jiraId: jiraId
              };
            });

            console.log("Extracted Data:", JSON.stringify(processedData, null, 2));
